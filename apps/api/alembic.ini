## configuraciones basicas de Alembic para la migración de la base de datos

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =  ## Dejamos esto vacío para inyectar la url de la base de datos desde settings.database_url en migrations/env.py, 
## para poder tener una sola fuente de  verdad de la conexion, y no tener que hacer varios cambios si cambia la base de datos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S